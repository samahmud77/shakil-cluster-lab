version: '3.8'
networks:
    kafka-cluster-net:
        driver: bridge
        ipam:
            config:
                - subnet: 172.10.10.0/27
                  gateway: 172.10.10.1
                 
services:
    kafka1:
        image: 'apache/kafka:4.1.0'
        container_name: kafka1
        ports:
            - '9092:9092'
            - '9093:9093'
        environment:
            KAFKA_BROKER_ID: 1
            CLUSTER_ID: 'shkil77-d7f3k29m2p5h4a1r8s'
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9095,3@kafka3:9097
            KAFKA_NUM_NETWORK_THREADS: 3
            KAFKA_NUM_IO_THREADS: 8
            KAFKA_LOG_DIRS: /opt/kafka/logs
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
            KAFKA_MIN_INSYNC_REPLICAS: 2
        networks:
          kafka-cluster-net:
            ipv4_address: 172.10.10.2

    kafka2:
        image: 'apache/kafka:4.1.0'
        container_name: kafka2
        ports:
            - '9094:9094'
            - '9095:9095'
        environment:
            KAFKA_BROKER_ID: 2
            CLUSTER_ID: 'shkil77-d7f3k29m2p5h4a1r8s'
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9095
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9094,CONTROLLER://kafka2:9095
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9095,3@kafka3:9097
            KAFKA_NUM_NETWORK_THREADS: 3
            KAFKA_NUM_IO_THREADS: 8
            KAFKA_LOG_DIRS: /opt/kafka/logs
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
            KAFKA_MIN_INSYNC_REPLICAS: 2
        networks:
          kafka-cluster-net:
            ipv4_address: 172.10.10.3
            
    kafka3:
        image: 'apache/kafka:4.1.0'
        container_name: kafka3
        ports:
            - '9096:9096'
            - '9097:9097'
        environment:
            KAFKA_BROKER_ID: 3
            CLUSTER_ID: 'shkil77-d7f3k29m2p5h4a1r8s'
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9096,CONTROLLER://:9097
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9096,CONTROLLER://kafka3:9097
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9095,3@kafka3:9097
            KAFKA_NUM_NETWORK_THREADS: 3
            KAFKA_NUM_IO_THREADS: 8
            KAFKA_LOG_DIRS: /opt/kafka/logs
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
            KAFKA_MIN_INSYNC_REPLICAS: 2
        networks:
          kafka-cluster-net:
            ipv4_address: 172.10.10.4
    kafdrop1:
        image: obsidiandynamics/kafdrop:latest
        container_name: kafdrop1
        ports:
            - '8989:9000'
        environment:
            KAFKA_BROKER_CONNECT: kafka1:9092,kafka2:9094,kafka3:9096
        depends_on:
            - kafka1
            - kafka2
            - kafka3
        networks:
          kafka-cluster-net:
            ipv4_address: 172.10.10.5
    
    kafka-connect:
        build: ./elastic-connector/
        # image: 'confluentinc/cp-kafka-connect'  
        container_name: kafka-connect
        ports:
            - '8083:8083'  
        environment:
            CONNECT_BOOTSTRAP_SERVERS: 172.10.10.2:9092,172.10.10.3:9092,172.10.10.4:9092
            CONNECT_REST_ADVERTISED_HOST_NAME: kafka-elastic-connector
            CONNECT_GROUP_ID: kafka-connect-group
            CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
            CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
            CONNECT_STATUS_STORAGE_TOPIC: connect-status
            CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
            CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
            CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
            CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
            CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
            CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
        depends_on:
            - kafka1
            - kafka2
            - kafka3
        networks:
            kafka-cluster-net:
                ipv4_address: 172.10.10.6
